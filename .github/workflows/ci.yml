name: Validate Nextbell
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:cloud
      - run: pnpm contracts && git diff --exit-code -- packages/cloud/openapi.json
      - run: pnpm test:cloud:emulator
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.12.6
      - run: tofu -chdir=infra/cloud fmt -check
      - run: tofu -chdir=infra/cloud init -backend=false -lockfile=readonly
      - run: tofu -chdir=infra/cloud validate
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:web
      - run: pnpm build
      - run: pnpm --filter @nextbell/web exec playwright install --with-deps chromium webkit
      - run: pnpm test:web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-browser-report
          path: apps/web/playwright-report/
  flutter-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - run: ./tool/check.sh
      - run: flutter build apk --debug
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-unsigned-release
          path: apps/mobile/build/app/outputs/bundle/release/*.aab
  ios:
    runs-on: macos-26
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build ios --release --no-codesign
      - name: Run native tests on an available iOS 26 simulator
        shell: bash
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for k,vs in d["devices"].items() if "iOS-26" in k for v in vs if "iPhone" in v["name"]))')
          xcodebuild test -workspace ios/Runner.xcworkspace -scheme Runner -destination "platform=iOS Simulator,id=$DEVICE_ID" CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-release
          path: apps/mobile/build/ios/iphoneos/Runner.app
