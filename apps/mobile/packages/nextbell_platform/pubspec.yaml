name: nextbell_platform
description: Nextbell's typed native Google authentication and persistent alarm adapters.
version: 1.0.0
publish_to: none
environment:
  sdk: '>=3.13.2 <4.0.0'
  flutter: '3.47.2'
dependencies:
  flutter:
    sdk: flutter
flutter:
  plugin:
    platforms:
      android:
        package: com.suhel.nextbell_platform
        pluginClass: NextbellPlatformPlugin
      ios:
        pluginClass: NextbellPlatformPlugin

dev_dependencies:
  pigeon: 28.0.0
  flutter_lints: 6.0.0
