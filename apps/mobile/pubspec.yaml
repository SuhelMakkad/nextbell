name: nextbell
description: Thoughtful alarms for what comes next. Google Calendar and Tasks, on your terms.
publish_to: none
version: 1.0.0+2
environment:
  sdk: '>=3.13.2 <4.0.0'
  flutter: '3.47.2'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  nextbell_platform:
    path: packages/nextbell_platform
  flutter_riverpod: 3.4.3
  go_router: 18.0.1
  drift: 2.34.4
  drift_flutter: 0.3.1
  path_provider: 2.1.6
  googleapis: 17.0.0
  http: 1.6.0
  crypto: 3.0.7
  intl: 0.20.3
  url_launcher: 6.3.2
  workmanager: 0.10.9
  cupertino_icons: 1.0.9
  firebase_core: 4.14.0
  firebase_auth: 6.6.1
  firebase_messaging: 16.6.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0
  build_runner: 2.16.1
  drift_dev: 2.34.6
  pigeon: 28.0.0
  timezone: 0.11.1
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/fonts/OFL.txt
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
